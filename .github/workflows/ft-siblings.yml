name: Future Today siblings

# plugin.video.ifoodtv: the Fawesome add-on with another Future Today site's
# constants (more siblings can join the matrix the same way). The cloud dev container cannot reach
# these sites; GitHub's runners can.
#   check -- drives each add-on's own router against the live service (Kodi
#            stubbed) and runs its endpoint spec; fails the job on error.
#   art   -- builds icon.png / fanart.jpg from each service's official
#            artwork (site share image, store icon) and commits them back to
#            the branch that ran it.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ft-siblings.yml'
      - 'plugin.video.ifoodtv/default.py'
      - 'plugin.video.ifoodtv/lib/**'
      - 'plugin.video.ifoodtv/tools/**'

concurrency:
  group: ft-siblings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        addon: [plugin.video.ifoodtv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Smoke test and endpoint check (fails the job on error)
        env:
          ADDON: ${{ matrix.addon }}
        run: |
          python3 -m pip install --quiet requests
          set +e
          python3 "$ADDON/tools/smoke_test.py" | tee smoke.txt; smoke=${PIPESTATUS[0]}
          # The endpoint check prints ::add-mask:: lines for tokens; drop them.
          python3 .github/endpoint-check/check_endpoints.py "$ADDON/tools/endpoints.json" 2>&1 \
            | grep -v '::add-mask::' | tee -a smoke.txt; ep=${PIPESTATUS[0]}
          { echo "### $ADDON"; echo '```'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$smoke" -gt "$ep" ] && exit "$smoke" || exit "$ep"

  art:
    runs-on: ubuntu-latest
    needs: check
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build icon and fanart from the official artwork
        run: |
          python3 -m pip install --quiet pillow
          for a in plugin.video.ifoodtv; do
            echo "== $a"
            python3 "$a/tools/fetch_logo.py" "$a/docs/recon/art"
            python3 "$a/tools/make_art.py" "$a/docs/recon/art"
          done
      - name: Commit art
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add plugin.video.ifoodtv/resources/icon.png plugin.video.ifoodtv/resources/fanart.jpg
          git diff --staged --quiet && exit 0
          git commit -m "iFood.tv: official icon and fanart (ft-siblings workflow)"
          git pull --rebase --autostash
          git push
