name: Starz endpoint check

# Starz documents none of the endpoints plugin.video.starz uses. This runs
# the chain the addon depends on (token minting, sign-in start, catalogue,
# series, search, artwork) daily, and on pushes that change the checker or
# the spec so a change can be tested from its branch. Only the scheduled run
# files an issue. No account or credentials are used.

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/endpoint-check/**'
      - '.github/workflows/endpoint-check.yml'
      - '.github/workflows/starz-endpoint-check.yml'
      - 'plugin.video.starz/tools/endpoints.json'

permissions:
  contents: read
  issues: write

jobs:
  starz:
    uses: ./.github/workflows/endpoint-check.yml
    with:
      spec: plugin.video.starz/tools/endpoints.json
      name: Starz
      issue_label: starz-endpoint
      open_issue: ${{ github.event_name == 'schedule' }}
