name: Endpoint check (reusable)

# Runs an addon's endpoint checks against the live service and optionally
# files one rolling issue when they fail. Callers pass either a declarative
# spec for the shared engine (.github/endpoint-check/check_endpoints.py) or,
# where a spec cannot express what has to be checked, their own script - Tubi
# signs every request, which no JSON spec can do. See endpoint-checks.yml for
# the callers.

on:
  workflow_call:
    inputs:
      spec:
        description: Path to the addon's endpoint spec (JSON). Either this or script.
        required: false
        type: string
        default: ''
      script:
        description: Path to the addon's own checker script, run instead of a spec.
        required: false
        type: string
        default: ''
      name:
        description: Human name used in the issue title
        required: true
        type: string
      issue_label:
        description: Label that identifies this addon's rolling issue
        required: true
        type: string
      open_issue:
        description: File/update an issue on failure (false for test runs)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # A checker script drives the addon's own code, which needs what the
      # addon needs. The shared engine is standard library only.
      - name: Install what the checker needs
        if: inputs.script != ''
        run: python3 -m pip install --quiet requests

      - name: Run endpoint checks
        id: check
        env:
          SPEC: ${{ inputs.spec }}
          SCRIPT: ${{ inputs.script }}
        run: |
          set +e
          if [ -n "$SCRIPT" ]; then
            python3 "$SCRIPT" | tee result.txt
            status=${PIPESTATUS[0]}
          elif [ -n "$SPEC" ]; then
            python3 .github/endpoint-check/check_endpoints.py "$SPEC" | tee result.txt
            status=${PIPESTATUS[0]}
          else
            echo 'one of spec or script has to be given' | tee result.txt
            status=2
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          { echo '```'; cat result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update an issue
        if: steps.check.outputs.status != '0' && inputs.open_issue
        uses: actions/github-script@v7
        env:
          ADDON_NAME: ${{ inputs.name }}
          ISSUE_LABEL: ${{ inputs.issue_label }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('result.txt', 'utf8');
            const label = process.env.ISSUE_LABEL;
            const title = `${process.env.ADDON_NAME} addon: an endpoint has changed`;
            // One rolling issue per addon rather than a new one every day.
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label,
            });
            const text = [
              'The endpoint check failed. The addon is likely broken until this is corrected.', '',
              '```', body.trim(), '```', '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body: text,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body: text, labels: [label],
              });
            }

      - name: Fail the run
        if: steps.check.outputs.status != '0'
        run: exit 1
