name: Endpoint check (reusable)

# Runs an addon's endpoint spec (see .github/endpoint-check/check_endpoints.py)
# against the live service, and optionally files one rolling issue when it
# fails. Each addon calls this with its own spec; see
# starz-endpoint-check.yml for an example caller.

on:
  workflow_call:
    inputs:
      spec:
        description: Path to the addon's endpoint spec (JSON)
        required: true
        type: string
      name:
        description: Human name used in the issue title
        required: true
        type: string
      issue_label:
        description: Label that identifies this addon's rolling issue
        required: true
        type: string
      open_issue:
        description: File/update an issue on failure (false for test runs)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run endpoint checks
        id: check
        run: |
          set +e
          python3 .github/endpoint-check/check_endpoints.py "${{ inputs.spec }}" | tee result.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          { echo '```'; cat result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update an issue
        if: steps.check.outputs.status != '0' && inputs.open_issue
        uses: actions/github-script@v7
        env:
          ADDON_NAME: ${{ inputs.name }}
          ISSUE_LABEL: ${{ inputs.issue_label }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('result.txt', 'utf8');
            const label = process.env.ISSUE_LABEL;
            const title = `${process.env.ADDON_NAME} addon: an endpoint has changed`;
            // One rolling issue per addon rather than a new one every day.
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label,
            });
            const text = [
              'The endpoint check failed. The addon is likely broken until this is corrected.', '',
              '```', body.trim(), '```', '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body: text,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body: text, labels: [label],
              });
            }

      - name: Fail the run
        if: steps.check.outputs.status != '0'
        run: exit 1
