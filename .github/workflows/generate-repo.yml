name: Generate Kodi Repository

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Generate repository files
      run: |
        import os
        import re
        import shutil
        import zipfile
        import hashlib
        import xml.etree.ElementTree as ET

        def version_key(v):
            """Numeric key for dotted versions like 2026.7.6.3; None if not plain numbers."""
            parts = v.split('.')
            return tuple(int(p) for p in parts) if all(p.isdigit() for p in parts) else None

        def older_entries(addon_id, zip_dir, current_version):
            """addons.xml entries for the older zips kept in zip_dir, newest first."""
            current_key = version_key(current_version)
            if current_key is None:
                return []
            found = []
            for name in os.listdir(zip_dir):
                if not (name.startswith(addon_id + '-') and name.endswith('.zip')):
                    continue
                try:
                    with zipfile.ZipFile(os.path.join(zip_dir, name)) as zf:
                        xml_text = zf.read(f'{addon_id}/addon.xml').decode('utf-8')
                    root = ET.fromstring(xml_text.encode('utf-8'))
                except Exception as e:
                    print(f"  old zip skipped ({name}): {e}")
                    continue
                version = root.get('version') or ''
                key = version_key(version)
                # Kodi downloads <id>-<version>.zip, so the name must match the addon.xml inside.
                if root.get('id') != addon_id or name != f'{addon_id}-{version}.zip':
                    print(f"  old zip skipped ({name}): id/version doesn't match file name")
                    continue
                if key is None or key >= current_key:
                    continue
                entry = xml_text[xml_text.find('<addon'):].strip()
                # Drop the changelog to keep addons.xml small.
                entry = re.sub(r'\s*<news>.*?</news>', '', entry, flags=re.S)
                found.append((key, version, entry))
            found.sort(reverse=True)
            for _, version, _ in found:
                print(f"  older version listed: {version}")
            return [entry for _, _, entry in found]

        # Addon folders to process
        addon_folders = [
            'repository.breezyslasher',
            'context.plexkodiconnect.download',
            'plugin.audio.audiobookshelf',
            'plugin.video.appletv',
            'script.akl.heroic',
            'script.webhook.runner',
            'script.scrcpy-launcher',
            'service.watchparty',
            'plugin.video.tubitv',
            'plugin.video.starz',
            'script.module.skipbuttons',
            'plugin.video.plexondemand',
            'plugin.video.fawesome'
        ]
        
        addons_xml_content = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<addons>\n'
        
        for addon_id in addon_folders:
            addon_path = addon_id
            addon_xml_path = os.path.join(addon_path, 'addon.xml')
            
            if not os.path.exists(addon_xml_path):
                print(f"Skipping {addon_id} - no addon.xml found")
                continue
            
            # Read addon.xml
            with open(addon_xml_path, 'r', encoding='utf-8') as f:
                addon_xml = f.read()
            
            # Parse XML properly to get version
            try:
                tree = ET.parse(addon_xml_path)
                root = tree.getroot()
                version = root.get('version')
                actual_addon_id = root.get('id')
            except Exception as e:
                print(f"Error parsing {addon_id}: {e}")
                continue
            
            if not version:
                print(f"Skipping {addon_id} - no version found")
                continue
            
            print(f"Processing {actual_addon_id} version {version}")
            
            # Create zips/addon_id directory
            zip_dir = os.path.join('zips', actual_addon_id)
            os.makedirs(zip_dir, exist_ok=True)
            
            # Copy addon.xml to zips/addon_id/
            with open(os.path.join(zip_dir, 'addon.xml'), 'w', encoding='utf-8') as f:
                f.write(addon_xml)

            # Copy the addon's declared artwork (icon, fanart, screenshots)
            # next to its addon.xml, keeping the relative path. Kodi's "Install
            # from repository" fetches art from <datadir>/<addon_id>/<asset
            # path>, not from inside the zip, so without these files the browser
            # shows a blank icon for every addon.
            meta = root.find("./extension[@point='xbmc.addon.metadata']")
            assets = meta.find('assets') if meta is not None else None
            if assets is not None:
                for el in assets:
                    rel = (el.text or '').strip()
                    if not rel:
                        continue
                    src = os.path.join(addon_path, rel)
                    if os.path.exists(src):
                        dst = os.path.join(zip_dir, rel)
                        os.makedirs(os.path.dirname(dst), exist_ok=True)
                        shutil.copy2(src, dst)
                        print(f"  art: {rel}")
                    else:
                        print(f"  art declared but missing: {rel}")
            
            # Create zip file with correct version
            zip_filename = f"{actual_addon_id}-{version}.zip"
            zip_path = os.path.join(zip_dir, zip_filename)
            
            # Keep prior zip files so clients with a stale addons.xml cache
            # can still resolve the URL they expect (avoids 404s on update).
            # If the current version's zip already exists, overwrite it.
            if os.path.exists(zip_path):
                os.remove(zip_path)

            # Development files that must not ship inside the Kodi addon zip
            skip_dirs = {'tests', '__pycache__', 'tools', 'docs'}
            skip_files = {'Dockerfile', 'docker-compose.yml'}

            with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zipf:
                for root_dir, dirs, files in os.walk(addon_path):
                    # Skip hidden and development-only folders
                    dirs[:] = [d for d in dirs if not d.startswith('.') and d not in skip_dirs]
                    for file in files:
                        if file.startswith('.') or file in skip_files:
                            continue
                        file_path = os.path.join(root_dir, file)
                        arcname = os.path.join(actual_addon_id, os.path.relpath(file_path, addon_path))
                        zipf.write(file_path, arcname)
            
            print(f"Created {zip_path}")
            
            # Add to addons.xml (extract just the <addon>...</addon> part)
            addon_start = addon_xml.find('<addon')
            if addon_start != -1:
                addons_xml_content += addon_xml[addon_start:].strip() + '\n'

            # List the older zips too, so Kodi's "Versions" button can install them.
            # Not for the repository add-on: downgrading it could point Kodi at an old feed.
            if not actual_addon_id.startswith('repository.'):
                for entry in older_entries(actual_addon_id, zip_dir, version):
                    addons_xml_content += entry + '\n'

        addons_xml_content += '</addons>\n'
        
        # Write addons.xml to ZIPS folder
        with open('zips/addons.xml', 'w', encoding='utf-8') as f:
            f.write(addons_xml_content)
        print("Created zips/addons.xml")
        
        # Generate MD5 in ZIPS folder
        md5 = hashlib.md5(addons_xml_content.encode('utf-8')).hexdigest()
        with open('zips/addons.xml.md5', 'w', encoding='utf-8') as f:
            f.write(md5)
        print(f"Created zips/addons.xml.md5: {md5}")
        
      shell: python
    
    - name: Commit and push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -A
        git diff --staged --quiet || git commit -m "Auto-update repository files"
        git push
