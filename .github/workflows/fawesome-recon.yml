name: Fawesome recon

# plugin.video.fawesome development helper. The cloud dev container cannot
# reach fawesome.tv; GitHub's runners can. No account exists on Fawesome, so
# there are no credentials.
#
#   check    -- on every push to the add-on's code: the offline Skip Buttons
#               service test, the add-on's own router against the live API
#               (Kodi stubbed) and the endpoint spec. Fails on error.
#   research -- run by hand (workflow_dispatch): the recon probes (site crawl,
#               API walk, audio tracks, live channels, skip markers, My List,
#               logos). They make hundreds of requests, so they never run on a
#               push -- that tripped Fawesome's rate limit (HTTP 429). Their
#               captures are uploaded as an artifact, never committed.

on:
  workflow_dispatch:
    inputs:
      research:
        description: Also run the recon probes (hundreds of requests)
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/fawesome-recon.yml'
      - 'plugin.video.fawesome/tools/**'
      - 'plugin.video.fawesome/default.py'
      - 'plugin.video.fawesome/service.py'
      - 'plugin.video.fawesome/lib/**'
      - 'script.module.skipbuttons/lib/**'

concurrency:
  group: fawesome-recon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Skip Buttons service, offline (real module, Kodi stubbed)
        run: python3 plugin.video.fawesome/tools/test_service.py
      - name: Smoke test and endpoint check (fails the job on error)
        run: |
          python3 -m pip install --quiet requests
          set +e
          python3 plugin.video.fawesome/tools/smoke_test.py | tee smoke.txt; smoke=${PIPESTATUS[0]}
          # The endpoint check prints ::add-mask:: lines for tokens; drop them.
          python3 .github/endpoint-check/check_endpoints.py \
            plugin.video.fawesome/tools/endpoints.json 2>&1 \
            | grep -v '::add-mask::' | tee -a smoke.txt; ep=${PIPESTATUS[0]}
          { echo '```'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$smoke" -gt "$ep" ] && exit "$smoke" || exit "$ep"

  research:
    if: github.event_name == 'workflow_dispatch' && inputs.research
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OUT: plugin.video.fawesome/docs/recon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Recon probes
        run: |
          python3 -m pip install --quiet requests
          set +e
          for step in "recon.py $OUT" "probe_api.py $OUT" "probe_audio.py $OUT/audio" \
                      "probe_live.py $OUT/live" "probe_markers.py" "probe_queue.py $OUT/queue" \
                      "fetch_logo.py $OUT/art"; do
            echo "::group::$step"
            python3 plugin.video.fawesome/tools/$step | tee -a research.txt
            echo "::endgroup::"
          done
          { echo '```'; head -c 900000 research.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload recon captures (not committed -- dev research only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fawesome-recon
          path: plugin.video.fawesome/docs/recon
          retention-days: 14
          if-no-files-found: ignore
