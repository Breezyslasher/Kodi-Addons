name: Fawesome recon

# plugin.video.fawesome development helper. The cloud dev container cannot
# reach fawesome.tv; GitHub's runners can. Crawls the public site for the
# content feed API, fetches every URL in tools/probe_urls.txt, and commits the
# report and response bodies to plugin.video.fawesome/docs/recon/ on the branch
# that ran it. No account exists on Fawesome, so there are no credentials.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fawesome-recon.yml'
      - 'plugin.video.fawesome/tools/recon.py'
      - 'plugin.video.fawesome/tools/probe_urls.txt'
      - 'plugin.video.fawesome/tools/probe_api.py'
      - 'plugin.video.fawesome/tools/smoke_test.py'
      - 'plugin.video.fawesome/tools/fetch_logo.py'
      - 'plugin.video.fawesome/default.py'
      - 'plugin.video.fawesome/lib/**'

concurrency:
  group: fawesome-recon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recon:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Recon and probes
        run: |
          python3 plugin.video.fawesome/tools/recon.py plugin.video.fawesome/docs/recon | tee recon.txt
          { echo '```'; head -c 900000 recon.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: API walk (token, home, feeds, a title, its manifests)
        run: |
          python3 plugin.video.fawesome/tools/probe_api.py plugin.video.fawesome/docs/recon | tee api.txt
          { echo '```'; cat api.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch official logo candidates
        run: |
          python3 plugin.video.fawesome/tools/fetch_logo.py plugin.video.fawesome/docs/recon/art | tee -a recon.txt
      # The add-on's own router against the live API, with Kodi stubbed.
      # Recorded rather than failing the job, so the results still commit.
      - name: Smoke test the add-on
        run: |
          python3 -m pip install --quiet requests
          set +e
          python3 plugin.video.fawesome/tools/smoke_test.py > plugin.video.fawesome/docs/recon/smoke.txt 2>&1
          echo "exit $?" >> plugin.video.fawesome/docs/recon/smoke.txt
          python3 .github/endpoint-check/check_endpoints.py plugin.video.fawesome/tools/endpoints.json 2>&1 | grep -v '::add-mask::' >> plugin.video.fawesome/docs/recon/smoke.txt
          echo "exit ${PIPESTATUS[0]}" >> plugin.video.fawesome/docs/recon/smoke.txt
          { echo '```'; cat plugin.video.fawesome/docs/recon/smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A plugin.video.fawesome/docs/recon
          git diff --staged --quiet && exit 0
          git commit -m "Fawesome: recon results (fawesome-recon workflow)"
          git pull --rebase --autostash
          git push
